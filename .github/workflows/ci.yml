name: CI

on:
  push:
    branches: [main, dev, test]
  pull_request:
    branches: [main]

# Read-only by default; nothing in this workflow needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go.mod and go.sum are tidy and verified
        run: |
          go mod verify
          go mod tidy -diff

      - name: fmt-check
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: test
        run: |
          set +e
          go test ./... -race -covermode=atomic -coverprofile=coverage.out -v > test.log 2>&1
          code=$?
          set -e
          cat test.log
          if [ $code -ne 0 ]; then
            grep -nE "FAIL|Error( |Trace)|panic:|\.go:[0-9]+:" test.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit $code
          fi
          go tool cover -func=coverage.out | tail -1

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: |
          go version
          set +e
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 > vuln.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            cat vuln.log
            head -10 vuln.log | while IFS= read -r line; do echo "::error::install: ${line}"; done
            exit $code
          fi
          govulncheck ./... > vuln.log 2>&1
          code=$?
          set -e
          cat vuln.log
          if [ $code -ne 0 ]; then
            grep -E "^(Vulnerability|  Found in|  Fixed in|    #)|Standard library|Module:" vuln.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit $code
          fi

  cross-build:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w -X github.com/FlexEbat/unattend-gen/internal/cli.version=ci" \
            -o "${{ runner.temp }}/unattend-gen$ext" ./cmd/unattend-gen

      - name: --version reports the injected version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          "${{ runner.temp }}/unattend-gen" --version | grep -q "unattend-gen version ci"
