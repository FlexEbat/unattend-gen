name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          check-latest: true

      - name: go mod tidy
        run: go mod tidy

      - name: commit go.sum if it changed
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            git config user.name "unattend-gen bot"
            git config user.email "unattend-gen@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "chore: update go.sum [skip ci]"
            git push
          fi

      - name: fmt-check
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: test
        run: |
          set +e
          go test ./... -race -v > test.log 2>&1
          code=$?
          set -e
          cat test.log
          if [ $code -ne 0 ]; then
            grep -nE "FAIL|Error( |Trace)|panic:|\.go:[0-9]+:" test.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit $code
          fi

  cross-build:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          check-latest: true

      - name: go mod tidy
        run: go mod tidy

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -o "${{ runner.temp }}/unattend-gen$ext" ./cmd/unattend-gen
