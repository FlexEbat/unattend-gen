name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          check-latest: true

      - name: go mod tidy
        run: go mod tidy

      - name: commit go.sum if it changed
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            git config user.name "unattend-gen bot"
            git config user.email "unattend-gen@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "chore: update go.sum [skip ci]"
            git push
          fi

      - name: fmt-check
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: test
        run: |
          set +e
          go test ./... -race -v > test.log 2>&1
          code=$?
          set -e
          cat test.log
          if [ $code -ne 0 ]; then
            grep -nE "FAIL|Error( |Trace)|panic:|\.go:[0-9]+:" test.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit $code
          fi

  cross-build:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          check-latest: true

      - name: go mod tidy
        run: go mod tidy

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -o "${{ runner.temp }}/unattend-gen$ext" ./cmd/unattend-gen

  # Temporary, manual-only: dump a real generated autounattend.xml as a log
  # annotation so it can be reviewed by hand against the actual Windows
  # component schema. Not part of the regular gate; remove after use.
  xml-preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          check-latest: true

      - name: go mod tidy
        run: go mod tidy

      - name: build and generate a rich sample profile
        run: |
          go build -o unattend-gen ./cmd/unattend-gen
          cat > preview.json << 'JSONEOF'
          {
            "schema_version": 1,
            "name": "preview",
            "language": {"ui_language": "de-DE", "locale": "fr-FR", "keyboard_layout": "en-GB"},
            "edition": {"mode": "generic_key", "edition": "Pro"},
            "computer_name": "PREVIEW-PC1",
            "accounts": [
              {"name": "admin", "display_name": "Site Admin", "password": "Sup3rSecret!", "group": "Administrators"},
              {"name": "guest", "display_name": null, "password": null, "group": "Users"}
            ],
            "first_logon": {"mode": "first_created_account"},
            "express_settings": {"mode": "all_disabled"},
            "system_tweaks": {"disable_windows_update": true, "disable_uac": true, "bypass_win11_requirements": true},
            "wifi": {"ssid": "Office-5G", "authentication": "WPA2Personal", "password": "wifipass1", "connect_hidden": true}
          }
          JSONEOF
          ./unattend-gen generate preview.json -o preview.xml
          cat preview.xml

      - name: dump XML as annotations (chunked, 4096-byte annotation limit)
        run: |
          python3 -c "
          with open('preview.xml') as f:
              data = f.read()
          escaped = data.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          chunk_size = 3500
          for i in range(0, len(escaped), chunk_size):
              print('::notice::' + escaped[i:i+chunk_size])
          "
